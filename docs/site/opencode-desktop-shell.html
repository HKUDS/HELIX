&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;

  &lt;title&gt;OpenCode Web Cockpit&lt;/title&gt;
  &lt;style&gt;
    :root {
      color-scheme: light;
      --paper: #f3f4ef;
      --ink: #171915;
      --muted: #666b60;
      --line: #171915;
      --panel: #fffdf7;
      --mint: #8bd7c8;
      --gold: #efc349;
      --red: #d95f43;
      --blue: #3867c8;
      --soft: #dde3d8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgb(23 25 21 / 0.06) 1px, transparent 1px),
        linear-gradient(0deg, rgb(23 25 21 / 0.06) 1px, transparent 1px),
        var(--paper);
      background-size: 22px 22px;
      font-family: &quot;Avenir Next&quot;, &quot;Gill Sans&quot;, ui-sans-serif, system-ui, sans-serif;
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 38px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      border-bottom: 4px solid var(--line);
      padding-bottom: 16px;
    }

    h1, h2, p { margin: 0; }

    h1 {
      font-size: 2.35rem;
      line-height: 1;
      letter-spacing: 0;
    }

    h2 {
      font-size: 0.92rem;
      letter-spacing: 0;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .badge {
      border: 2px solid var(--line);
      background: var(--gold);
      padding: 9px 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .fact {
      border: 2px solid var(--line);
      background: var(--panel);
      padding: 12px;
      box-shadow: 5px 5px 0 var(--soft);
    }

    .fact strong {
      display: block;
      font-size: 1.8rem;
      line-height: 1;
    }

    .fact span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(310px, 0.8fr);
      gap: 18px;
      margin-top: 22px;
      align-items: start;
    }

    section {
      border-top: 3px solid var(--line);
      padding-top: 12px;
      min-width: 0;
    }

    section + section {
      margin-top: 20px;
    }

    ul {
      display: grid;
      gap: 8px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      min-height: 42px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      border: 2px solid var(--line);
      background: var(--panel);
      padding: 8px 10px;
    }

    li:nth-child(3n + 1) { border-left: 10px solid var(--mint); }
    li:nth-child(3n + 2) { border-left: 10px solid var(--red); }
    li:nth-child(3n) { border-left: 10px solid var(--blue); }

    li span {
      overflow-wrap: anywhere;
      font-weight: 850;
    }

    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    code {
      border: 1px solid var(--line);
      background: #eef7d4;
      padding: 3px 6px;
      font-size: 0.76rem;
      white-space: nowrap;
    }

    pre {
      overflow: auto;
      border: 2px solid var(--line);
      background: #151915;
      color: #ecf4dc;
      padding: 12px;
      margin: 0;
      min-height: 170px;
      white-space: pre-wrap;
    }

    @media (max-width: 840px) {
      header,
      .facts,
      .grid {
        grid-template-columns: 1fr;
      }
    }
  &lt;/style&gt;
