# ==============================================================================
# HELIX Closed-Loop LoRA Training Configuration
# Model: Qwen/Qwen2.5-Coder-7B-Instruct
# Pipeline: SFT (Supervised Fine-Tuning) + DPO (Direct Preference Optimization)
# ==============================================================================

model:
  base_model_name: "Qwen/Qwen2.5-Coder-7B-Instruct"
  max_seq_length: 4096
  load_in_4bit: true
  dtype: "bfloat16" # "bfloat16" for Ampere/Hopper (A100/H100/A10G)

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  task_type: "CAUSAL_LM"

training:
  stage: "sft_then_dpo" # Options: sft, dpo, sft_then_dpo
  epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  logging_steps: 5
  save_strategy: "epoch"
  seed: 42
  optimizer: "adamw_8bit"

dpo:
  beta: 0.1
  learning_rate: 5.0e-6
  epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_prompt_length: 2048
  max_length: 4096

storage:
  modal_volume_name: "helix-checkpoints-volume"
  checkpoint_dir: "/vol/checkpoints/qwen-2.5-coder-7b-helix-lora"
  sft_output_dir: "/vol/checkpoints/sft_output"
  dpo_output_dir: "/vol/checkpoints/dpo_output"
  final_adapter_dir: "/vol/checkpoints/helix_lora_final"

